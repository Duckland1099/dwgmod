[core]
name: V-E
class: CustomUnitMetadata
price: 3600000
maxHp: 10000
mass: 250
techLevel: 1

availableInDemo: true
radius: 11
displayRadius: 13
autoTriggerCooldownTime: 2s
fogOfWarSightRange: 45
buildSpeed: 250s
#15 = default
tags: earthmover, thebuffer
fogOfWarSightRangeWhileNotBuilt: 15
isBio: false
energyMax: 15
energyRegen: 0
energyRegenWhenRecharging: 0.1
energyNeedsToRechargeToFull:  true
armourMinDamageToKeep: 0
builtFrom_2_name: BS_DEAV_Factory
builtFrom_2_pos:  1.1
canRepairUnitsOnlyWithTags: engi
nanoRange: 350
nanoRepairSpeed:1
autoRepair:true 
canRepairUnits: true

# for heal on kill and random weapon and unit place
@memory lastHealKills: float
@memory weaponran: float
@memory placing: float
@memory turret: float


[hiddenAction_slotInit]
autoTriggerOnEvent: created
 setUnitMemory: weaponran = int(rnd(1,4))
 showMessageToAllPlayers: // Blood is Fuel, this warfare is full \\


[hiddenAction_laserrampup]
setUnitStats: shootDamageMultiplier+=1.3
addResources: setFlag=2


[hiddenAction_plamsarampup]
setUnitStats: shootDamageMultiplier+=1.5
addResources: setFlag=2



[hiddenAction_laserreset]
autoTrigger: if self.hasFlag(id=2) 
requireConditional:  if not self.isEnergyEmpty() or not self.isAttacking()
setUnitStats: shootDamageMultiplier=1
[action_revolver]
text: Switch to the Revolver
pos: 1.0
setUnitMemory: weaponran = 1
buildSpeed: 0.5s
highPriorityQueue: true
[action_TAU]
text: Switch to the TAU Cannon
pos: 1.0
setUnitMemory: weaponran = 2
buildSpeed: 1.5s
highPriorityQueue: true
[action_Shotgun]
text: Switch to the Shotgun
pos: 1.0
setUnitMemory: weaponran = 3
buildSpeed: 1s
highPriorityQueue: true
[action_SMG]
text: Switch to the SMG
pos: 1.0
setUnitMemory: weaponran = 4
buildSpeed: 1s  	
highPriorityQueue: true

[hiddenAction_Placement]
autoTrigger: if self.customTimer(laterThanSeconds=60) and not self.hasFlag(id=11) and not self.hasFlag(id=7)
resetCustomTimer: true
setUnitMemory: placing = int(rnd(1,6))
allowMultipleInQueue: true


[hiddenAction_Placement2]
autoTrigger: if self.customTimer(laterThanSeconds=60) and not self.hasFlag(id=11) and self.hasFlag(id=7)
resetCustomTimer: true
setUnitMemory: placing = int(rnd(1,8))
allowMultipleInQueue: true


[hiddenAction_Placement3]
autoTrigger: if self.customTimer(laterThanSeconds=59)
setUnitMemory: turret = int(rnd(1,1))
allowMultipleInQueue: true


[hiddenAction_spawnDCRmini]
autoTrigger: if memory.placing == 1
spawnUnits: DCR-Minigun(offsetRandomX=100, offsetRandomY=100)
setUnitMemory: placing = 0
[hiddenAction_spawnDCRmini2]
autoTrigger: if memory.placing == 2
spawnUnits: DCR-SMGLD(offsetRandomX=100, offsetRandomY=100)
setUnitMemory: placing = 0
[hiddenAction_spawnDCRmini3]
autoTrigger: if memory.placing == 3
spawnUnits: DCR-Shotgun(offsetRandomX=100, offsetRandomY=100)
setUnitMemory: placing = 0
[hiddenAction_spawnDCRmini4]
autoTrigger: if memory.placing == 4
spawnUnits:Electrolaser_Sergeant(offsetRandomX=100, offsetRandomY=100)
setUnitMemory: placing = 0
[hiddenAction_spawnDCRmini5]
autoTrigger: if memory.placing == 5 or memory.placing == 6
spawnUnits: DCR-TAU(offsetRandomX=100, offsetRandomY=100)
setUnitMemory: placing = 0

[hiddenAction_spawnDCRmini6]
autoTrigger: if memory.placing == 7 or memory.placing == 8
spawnUnits: DEAV_Basic(offsetRandomX=100, offsetRandomY=100)
setUnitMemory: placing = 0


[hiddenAction_spawnturret]
autoTrigger: if memory.turret == 1
spawnUnits: DT_base(offsetRandomX=100, offsetRandomY=100)
setUnitMemory: turret = 0

[hiddenAction_mineplace]
autoTrigger: if self.numberOfUnitsInEnemyTeam(withinRange=500) < 3 and not numberOfUnitsInTeam(withTag='mine', greaterthan=5, withinRange=500) and not self.hasFlag(id=11) and not self.isAttacking() 
fireTurretXAtGround: mineplace
fireTurretXAtGround_withTarget: createMarker(self.x + rnd(-150,150), self.y + rnd(-150,150))
addResources: setFlag=11
alsoQueueAction: spawnMineReset
allowMultipleInQueue: true
[hiddenAction_spawnMineReset]
buildSpeed: 30s
addResources: unsetFlag=11
allowMultipleInQueue: true


[action_upgrade_revolver]
text: Upgrade Revolver 
description: allows the Revolver to bounce targets up to 2 times
whenBuilding_cannotMove: true
price: Byzantium=10, credits=5000
buildSpeed: 30s
isVisible: if memory.weaponran == 1 and not self.hasFlag(id=1)
addResources: setFlag=1
highPriorityQueue: true


[action_upgrade_smg]
text: Upgrade Smg
description: deals more damage and stronger ramp up
whenBuilding_cannotMove: true
price: Byzantium=100, credits=10000
buildSpeed: 30s
isVisible: if memory.weaponran == 4 and not self.hasFlag(id=23)
addResources: setFlag=23
highPriorityQueue: true


[action_unlock_mindcontrol]
text: Unlock weapon
description: unlocks mindcontrol weapon COSTS Byzantium to shoot
whenBuilding_cannotMove: true
price: Byzantium=150, credits=10000
buildSpeed: 30s
addResources: setFlag=20
highPriorityQueue: true
isVisible: if not self.hasFlag(id=20)
ai_isDisabled: true






[action_unlock_nuke]
text: Unlock weapon
description: unlocks Nuke weapon
whenBuilding_cannotMove: true
price: Byzantium=200, credits=20000
buildSpeed: 30s
addResources: setFlag=21
highPriorityQueue: true
isVisible: if not self.hasFlag(id=21)
ai_isDisabled: true
[action_mind]
text: Switch to the Mind control
pos: 1.0
setUnitMemory: weaponran = 5
buildSpeed: 1s
highPriorityQueue: true
isVisible: if self.hasFlag(id=20)


[action_unlocknest]
text: unlock new mine
description: allows V-E to place roach nests
price: Byzantium=100, credits= 15000
buildSpeed: 30s
addResources: setFlag=5
highPriorityQueue: true
isVisible: if not self.hasFlag(id=5)


[hiddenAction_roachplace]
autoTrigger: if self.numberOfUnitsInEnemyTeam(withinRange=500) < 3 and not numberOfUnitsInTeam(withTag='mine', greaterthan=5, withinRange=500) and not self.hasFlag(id=6) and not self.isAttacking() and self.hasFlag(id=5)
fireTurretXAtGround: roachplace
fireTurretXAtGround_withTarget: createMarker(self.x + rnd(-150,150), self.y + rnd(-150,150))
addResources: setFlag=6
alsoQueueAction: roachReset
allowMultipleInQueue: true
[hiddenAction_roachReset]
buildSpeed: 30s
addResources: unsetFlag=6
allowMultipleInQueue: true



[action_unlockdeav]
text: Unlock DEAV
description: allows V-E to build DEAV basic
whenBuilding_cannotMove: true
price: Byzantium=125, credits=15000
buildSpeed: 30s
addResources: setFlag=7
highPriorityQueue: true
isVisible: if not self.hasFlag(id=7)




