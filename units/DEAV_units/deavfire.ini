


[core]
name: DEAV_Inferno
class: CustomUnitMetadata
tags: engi
price: 5000
maxHp: 800
mass: 6000
armour: 15
techLevel: 1
buildSpeed: 0.0006

fogOfWarSightRange: 20
radius: 23
isBio: false
softCollisionOnAll: 0



transportSlotsNeeded: 2

# Energy system
energyMax: 10
energyRegen: 0.01
energyRegenWhenRecharging: 0.1
energyNeedsToRechargeToFull: true

# Factories
# Factories
builtFrom_1_name: BS_DEAV_Factory
builtFrom_1_pos: 7

[hiddenAction_laserrampup]
setUnitStats: shootDamageMultiplier+=1.01
addResources: setFlag=2

[hiddenAction_laserreset]
autoTrigger: if self.hasFlag(id=2) 
requireConditional:  if not self.isEnergyEmpty() or not self.isAttacking()
setUnitStats: shootDamageMultiplier=1

[hiddenAction_buff]
autoTrigger: if self.hasUnitInTeam(withtag='thebuffer', withinRange=500)
setUnitStats: armour = 20, maxHp = 900, shootDamageMultiplier = 1.5, shield = 450, shieldRegen = 0.25
[hiddenAction_debuff]
autoTrigger: if not self.hasUnitInTeam(withtag='thebuffer',withinRange=500)
resetCustomTimer: true
[graphics]
total_frames: 1

image:        DBBF.png
image_wreak:  NONE
